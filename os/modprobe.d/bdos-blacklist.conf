# BDOS kernel-module blacklist -- /etc/modprobe.d/bdos-blacklist.conf
#
# Removes rarely-used, high-attack-surface kernel modules from reach. Each entry
# maps the module to the alias /bin/true so that even a request to auto-load it
# (the usual foothold-to-kernel path) fails silently. `blacklist` alone only
# stops alias-based autoload; `install ... /bin/true` also stops explicit
# `modprobe`, which is why both are used together per module.
#
# Comment out any module a legitimate workload here actually needs, and reload
# with `depmod -a`. These defaults suit a hardened server.

# -- exotic / rare network protocols (CVE-heavy, almost never used) ----------
install dccp /bin/true          # Datagram Congestion Control Protocol
install sctp /bin/true          # Stream Control Transmission Protocol
install rds /bin/true           # Reliable Datagram Sockets (repeated LPE history)
install tipc /bin/true          # Transparent Inter-Process Communication
install n-hdlc /bin/true        # High-level Data Link Control line discipline
install ax25 /bin/true          # amateur-radio AX.25 protocol
install netrom /bin/true        # amateur-radio NET/ROM protocol
install x25 /bin/true           # legacy X.25 packet switching
install rose /bin/true          # amateur-radio ROSE protocol
install decnet /bin/true        # legacy DECnet protocol
install econet /bin/true        # legacy Acorn Econet protocol
install af_802154 /bin/true     # IEEE 802.15.4 low-rate wireless
install ipx /bin/true           # legacy Novell IPX protocol
install appletalk /bin/true     # legacy AppleTalk protocol
install psnap /bin/true         # SubnetworkAccessProtocol
install p8023 /bin/true         # 802.3 raw framing
install p8022 /bin/true         # 802.2 LLC framing

# -- physical DMA / hotplug attack surface (evil-maid, juice-jacking) --------
install firewire-core /bin/true # FireWire has full DMA to host memory
install firewire-ohci /bin/true
install thunderbolt /bin/true   # Thunderbolt DMA (headless servers do not need it)
blacklist firewire-core
blacklist firewire-ohci
blacklist thunderbolt

# -- rarely-needed filesystems (auto-mount exploitation via malicious media) -
install cramfs /bin/true        # historic compressed rom filesystem
install freevxfs /bin/true      # Veritas filesystem
install jffs2 /bin/true         # flash filesystem
install hfs /bin/true           # legacy Apple HFS
install hfsplus /bin/true       # legacy Apple HFS+
install squashfs /bin/true      # comment out if you use snap/AppImage/containers
install udf /bin/true           # comment out if this host mounts optical media
install gfs2 /bin/true          # cluster filesystem

# -- USB mass storage (optional: enable on kiosks/DMZ to block data smuggling)
# Uncomment the next two lines on hosts that must never accept a USB drive.
#install usb-storage /bin/true   # block USB mass storage (exfil / malware ingress)
#blacklist usb-storage

# -- Bluetooth (headless servers have no use for it) -------------------------
install bluetooth /bin/true
install btusb /bin/true
blacklist bluetooth
blacklist btusb
