# BDOS -- registre des contrôles (exemple)
#
# Un contrôle par principe de l'essai (docs/domaine-noir-cyberdefense.md, §3).
# Chaque entrée dit de quelle attaque elle est la cicatrice, contre quelle arme
# elle a été conçue, qui peut la lever, si elle se défait, comment un tiers peut
# constater qu'elle tient, et quand on la regarde de nouveau.
#
#   bdosctl registry check    os/etc/bdos/controls.toml
#   bdosctl registry coverage os/etc/bdos/controls.toml
#
# L'exemple contient volontairement deux défauts, pour la démonstration :
# C-3.8-seal-enclave peut être levé par un seul rôle alors qu'il est
# irréversible, et C-3.5-uniform-errors porte une exception expirée.
#
# kind = "loi"   : tient face à un administrateur de production compromis, et
#                  un tiers peut le vérifier (third_party_check obligatoire).
# kind = "regle" : quelqu'un peut la lever (lifted_by obligatoire).
# property_based : true si le contrôle tient quelle que soit l'arme (diode,
#                  quorum) ; false s'il repose sur la reconnaissance d'une arme.

[[control]]
id = "C-3.1-egress-deny"
principle = "3.1"
title = "Sortie interdite par défaut, mandataire explicite et DNS protecteur"
kind = "regle"
scar = "Exfiltration par canal DNS et par HTTPS direct depuis des serveurs sans besoin de sortie"
threat_hypothesis = "Charge malveillante qui doit joindre un serveur de commande ou une destination de dépôt"
effect_class = "exfiltration"
property_based = true
lifted_by = ["equipe-reseau", "rssi"]
resists_compromised_admin = false
reversible = true
indicator = "Part des flux sortants via mandataire ; test de démarrage à froid"
owner = "equipe-reseau"
review_by = 2027-03-31

[[control]]
id = "C-3.2-worm-logs"
principle = "3.2"
title = "Journaux en stockage inaltérable (mode conformité) dans un compte distinct"
kind = "loi"
scar = "Effacement des journaux par l'attaquant devenu administrateur avant la découverte"
threat_hypothesis = "Administrateur de production compromis qui veut effacer ses traces"
effect_class = "effacement-de-traces"
property_based = true
lifted_by = []
resists_compromised_admin = true
third_party_check = "Configuration de rétention lisible par l'auditeur ; empreinte quotidienne publiée hors du compte"
reversible = false
indicator = "Jours de rétention effectifs ; écarts entre empreintes publiées et recalculées"
owner = "soc"
review_by = 2027-06-30

[[control]]
id = "C-3.3-ct-monitoring"
principle = "3.3"
title = "Surveillance des journaux de transparence des certificats pour nos domaines"
kind = "regle"
scar = "Sous-domaine de préproduction découvert par un attaquant via un certificat publié"
threat_hypothesis = "Reconnaissance passive à partir de ce que l'organisation publie sans le savoir"
effect_class = "reconnaissance"
property_based = false
lifted_by = ["soc"]
resists_compromised_admin = false
reversible = true
indicator = "Délai entre émission d'un certificat et revue par le SOC"
owner = "soc"
review_by = 2027-01-31

[[control]]
id = "C-3.4-short-secrets"
