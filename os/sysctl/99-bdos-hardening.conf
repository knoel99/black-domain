# BDOS kernel hardening -- /etc/sysctl.d/99-bdos-hardening.conf
#
# Shrinks the kernel attack surface that a foothold on this host would pivot
# through. Applied at boot by systemd-sysctl and on demand by `sysctl --system`.
# Each line is annotated with the threat it closes. Values are conservative
# defaults for a server; audit before enabling on a workstation or hypervisor.

# -- kernel information leaks ------------------------------------------------
kernel.kptr_restrict = 2              # hide kernel pointers from all users (defeats KASLR-info leaks)
kernel.dmesg_restrict = 1             # only privileged users may read the kernel ring buffer
kernel.printk = 3 3 3 3               # keep low-severity kernel messages off the console
kernel.kexec_load_disabled = 1        # forbid loading a new kernel at runtime (anti-persistence)
kernel.sysrq = 0                      # disable the magic SysRq key (no out-of-band kernel control)
kernel.perf_event_paranoid = 3        # deny unprivileged access to performance counters
kernel.unprivileged_bpf_disabled = 1  # only privileged users may load BPF (huge exploit surface)
net.core.bpf_jit_harden = 2           # harden the BPF JIT against spraying/JIT-spray attacks

# -- process isolation / anti-debug -----------------------------------------
kernel.yama.ptrace_scope = 2          # only admins may ptrace; blocks cred/secret theft between procs
kernel.unprivileged_userns_clone = 0  # no unprivileged user namespaces (a classic priv-esc primitive)
fs.protected_symlinks = 1             # block symlink-following attacks in world-writable dirs
fs.protected_hardlinks = 1            # block hardlink-based attacks in world-writable dirs
fs.protected_fifos = 2                # restrict FIFO creation in sticky world-writable dirs
fs.protected_regular = 2              # restrict regular-file creation in sticky world-writable dirs
fs.suid_dumpable = 0                  # never core-dump setuid programs (avoid secret leakage)
kernel.core_uses_pid = 1              # if a core is written, name it by pid (no clobber/symlink games)

# -- network: address spoofing and reconnaissance ---------------------------
net.ipv4.conf.all.rp_filter = 1           # strict reverse-path filtering (drop spoofed source IPs)
net.ipv4.conf.default.rp_filter = 1       # same for interfaces brought up later
net.ipv4.tcp_syncookies = 1               # survive SYN-flood without dropping legitimate connections
net.ipv4.icmp_echo_ignore_broadcasts = 1  # do not answer broadcast pings (no smurf amplification)
net.ipv4.icmp_ignore_bogus_error_responses = 1  # ignore malformed ICMP error responses
net.ipv4.conf.all.accept_redirects = 0    # ignore ICMP redirects (no attacker route injection)
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0    # ignore even "secure" redirects
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0      # never send ICMP redirects (we are not a router)
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0 # drop source-routed packets (bypass primitive)
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1        # log packets with impossible source addresses
net.ipv4.conf.default.log_martians = 1
net.ipv6.conf.all.accept_ra = 0           # ignore IPv6 router advertisements (no rogue-RA hijack)
net.ipv6.conf.default.accept_ra = 0

# -- memory / exploit mitigation --------------------------------------------
kernel.randomize_va_space = 2         # full ASLR for stack, heap, mmap, and executable base
vm.mmap_min_addr = 65536              # keep the null page unmappable (defeats null-deref exploits)
vm.unprivileged_userfaultfd = 0       # deny unprivileged userfaultfd (a use-after-free amplifier)
